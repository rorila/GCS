<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS Autoren-Handbuch — GCS Native Edition</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10141f; font-family: 'Segoe UI', system-ui, sans-serif; }
        #run-stage { position: absolute; transform-origin: top left; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
        #handbook-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #7c9dff; gap: 12px; font-size: 1.1rem; z-index: 999; transition: opacity .3s; }
        button { cursor: pointer; }
        /* Drehbücher und Screenshot-Platzhalter innerhalb von TRichText */
        #run-stage .screenshot-placeholder { border: 2px dashed #94a3c7; border-radius: 10px; padding: 18px; margin: 14px 0;
            text-align: center; opacity: .85; }
        #run-stage .drehbuch { border: 1px solid currentColor; border-radius: 8px; padding: 6px 12px; margin: 10px 0; opacity: .9; font-style: italic; }
        #run-stage .drehbuch strong { display: block; font-style: normal; margin-bottom: 4px; }
        /* Tabellen werden sanitizing-konform als div-Struktur ausgeliefert */
        #run-stage .hb-table { margin: 10px 0; border: 1px solid #8b98b8; border-radius: 8px; overflow: hidden; }
        #run-stage .hb-tr { display: flex; }
        #run-stage .hb-tr:not(:last-child) { border-bottom: 1px solid rgba(140,152,184,.4); }
        #run-stage .hb-th { font-weight: 700; background: rgba(120,140,180,.15); }
        #run-stage .hb-th, #run-stage .hb-td { flex: 1; padding: 5px 9px; font-size: .92em;
            border-right: 1px solid rgba(140,152,184,.4); }
        #run-stage .hb-th:last-child, #run-stage .hb-td:last-child { border-right: 0; }
        #run-stage pre { background: rgba(120,130,160,.15); border-radius: 8px; padding: 10px; overflow-x: auto; }
        #run-stage code { background: rgba(120,130,160,.22); border-radius: 4px; padding: 1px 5px; }
        #run-stage pre code { background: none; padding: 0; }
        #run-stage blockquote { border-left: 3px solid #7c9dff; margin: 10px 0; padding: 4px 14px; opacity: .9; }
        #run-stage h1, #run-stage h2, #run-stage h3 { margin: .6em 0 .3em; }
        #run-stage a { color: #6fa3ff; }
    </style>
</head>
<body>
    <div id="handbook-loading">📖 GCS Autoren-Handbuch<div style="font-size:.8rem;opacity:.7">GCS Native Edition · deklaratives Projekt</div></div>
    <main id="run-stage" aria-label="Handbuch"></main>
    <script src="./project.js"></script>
    <script src="./runtime-standalone.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('handbook-loading').style.display = 'none';
            window.startStandalone(window.PROJECT);
        });
    </script>
</body>
</html>
