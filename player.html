<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GCS Game Plattform">
    <meta name="mobile-web-app-capable" content="yes">
    <title>GCS Game Plattform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #0f172a; /* Deep blue background */
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: white;
        }
        #run-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            background: #000;
            overflow: hidden;
        }
        .game-object {
            position: absolute;
            user-select: none;
        }
    </style>
</head>
<body>
    <main id="run-stage"></main>
    <script type="module" src="/src/player-standalone.ts"></script>
</body>
</html>
