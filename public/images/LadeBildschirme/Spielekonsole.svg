<svg xmlns="http://www.w3.org/2000/svg" width="320" height="150" viewBox="0 0 320 150">
  <style>
    .dot {
      animation: pulse 1.2s infinite ease-in-out;
      transform-origin: center;
    }
    .d2 { animation-delay: .2s; }
    .d3 { animation-delay: .4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: .3; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- Game Controller -->
  <g transform="translate(110 15)" fill="none" stroke="#4b5563" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 25
             C10 25 5 38 3 56
             C1 72 12 78 22 67
             L32 56
             H68
             L78 67
             C88 78 99 72 97 56
             C95 38 90 25 75 25
             Z"
          fill="#f5c451"/>

    <!-- Steuerkreuz -->
    <path d="M25 39 V55 M17 47 H33"/>

    <!-- Buttons -->
    <circle cx="72" cy="43" r="4" fill="#ef6b6b" stroke="none"/>
    <circle cx="82" cy="52" r="4" fill="#69b7e5" stroke="none"/>
  </g>

  <!-- Ladepunkte -->
  <g fill="#4b5563">
    <circle class="dot" cx="143" cy="95" r="5"/>
    <circle class="dot d2" cx="160" cy="95" r="5"/>
    <circle class="dot d3" cx="177" cy="95" r="5"/>
  </g>

  <!-- Text -->
  <text x="160" y="128"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="600"
        fill="#374151">
    Das Spiel wird geladen
  </text>
</svg>