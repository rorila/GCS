# Gemeinsamer HTTPS-Eingang für den GCS-Container auf Fly.io.
#
# Lauscht intern auf :8000 (Fly terminiert TLS am Edge und reicht weiter).
# Strikte Allowlist: nicht aufgeführte Pfade erhalten 404 — kein generischer
# SPA-Fallback. Editor-/Diagnose-Routen liegen in editor.conf und werden vom
# Entrypoint nur eingeblendet, wenn GCS_EDITOR_PUBLIC=1 gesetzt ist.
worker_processes 1;
pid /run/gcs-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    client_max_body_size 64m;
    client_body_timeout 30s;

    # Temp-Verzeichnisse außerhalb der nginx-Systempfade (Container-User).
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $gcs_connection_upgrade {
        default upgrade;
        ''      close;
    }
    # Fly Proxy sets Fly-Client-IP; discard the incoming XFF chain.
    map $http_fly_client_ip $gcs_client_ip {
        '' $remote_addr;
        default $http_fly_client_ip;
    }
    map $http_x_forwarded_proto $gcs_forwarded_proto {
        default $scheme;
        https https;
    }

    server {
        listen 8000;
        server_name _;

        # Only the Fly-Client-IP supplied by Fly Proxy is forwarded to CMS.
        # The Fly service must be the only public entrypoint into this Machine.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $gcs_client_ip;
        proxy_set_header X-Forwarded-Proto $gcs_forwarded_proto;
        proxy_set_header X-Real-IP $gcs_client_ip;
        proxy_http_version 1.1;

        # ── Health ─────────────────────────────────────────────────────
        location = /health/live { return 204; }
        location = /health/ready { proxy_pass http://127.0.0.1:8081/api/cms/health; }

        # ── CMS: Seiten, API und Live-WebSocket (:8081) ────────────────
        location = /api/cms/party/live {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $gcs_client_ip;
            proxy_set_header X-Forwarded-Proto $gcs_forwarded_proto;
            proxy_set_header X-Real-IP $gcs_client_ip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $gcs_connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /api/cms/ { proxy_pass http://127.0.0.1:8081; }
        location /play/ { proxy_pass http://127.0.0.1:8081; }
        location /avatars/ { proxy_pass http://127.0.0.1:8081; }
        location = /runtime-standalone.js { proxy_pass http://127.0.0.1:8081; }
        location = /cms-shell.js { proxy_pass http://127.0.0.1:8081; }
        location = / { proxy_pass http://127.0.0.1:8081; }
        location ~ ^/(admin|house|super|roles|parent|observer|sponsor|library|sql)(/|\?|$) {
            proxy_pass http://127.0.0.1:8081;
        }
        location ~ ^/(admin-login|admin-logout|admin-enroll|parent-enroll|observer-enroll|sponsor-enroll)(/|\?|$) {
            proxy_pass http://127.0.0.1:8081;
        }

        # ── Game-Server: Multiplayer-WS und Spiel-/Lobby-REST (:8080) ──
        location = /ws/game {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $gcs_client_ip;
            proxy_set_header X-Forwarded-Proto $gcs_forwarded_proto;
            proxy_set_header X-Real-IP $gcs_client_ip;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $gcs_connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /api/platform/ { proxy_pass http://127.0.0.1:8080; }
        location /rooms/ { proxy_pass http://127.0.0.1:8080; }
        location ~ ^/platform/games(/|$) {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }
        location /runtimes/ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8080;
        }

        # ── Statische Medien direkt aus dem Image ──────────────────────
        location /images/ { alias /app/public/images/; }
        location /audio/  { alias /app/public/audio/; }
        location /videos/ { alias /app/public/videos/; }

        # Optionale Editor-Routen (Entrypoint befüllt /run/gcs-editor.conf
        # mit deploy/fly/editor.conf oder lässt die Datei leer).
        include /run/gcs-editor.conf;

        # Kein generischer Fallback: alles andere ist nicht freigegeben.
        location / { return 404; }
    }
}
