# Optionale Editor-Routen — wird vom Entrypoint nur nach /run/gcs-editor.conf
# kopiert, wenn GCS_EDITOR_PUBLIC=1 gesetzt ist.
#
# ACHTUNG: Die Editor-/Dev-APIs des Game-Servers sind aktuell NICHT
# authentifiziert. Dieser Block darf nur aktiviert werden, wenn eine
# Absicherung davor liegt (z. B. Phase-B-Entwicklerkonten) — oder in einer
# Staging-Umgebung ohne produktive Daten.
# Zusätzlich muss der Game-Server mit GCS_EDITOR_APIS != 'off' laufen.

# Editor-Frontend (Vite-Build, base './')
location /editor/ {
    alias /app/dist/;
    try_files $uri $uri/ /editor/index.html;
}

# Dev-/Agenten-/Upload-APIs des Game-Servers
location /api/dev/ { proxy_pass http://127.0.0.1:8080; }
location /api/agent/ { proxy_pass http://127.0.0.1:8080; }
location /api/data/ { proxy_pass http://127.0.0.1:8080; }
location /api/upload/ { proxy_pass http://127.0.0.1:8080; }
location /api/tts { proxy_pass http://127.0.0.1:8080; }
location /api/training/ { proxy_pass http://127.0.0.1:8080; }
location ~ ^/api/images(/|$) { proxy_pass http://127.0.0.1:8080; }
location ~ ^/api/library(/|$) { proxy_pass http://127.0.0.1:8080; }
location /kb/ { proxy_pass http://127.0.0.1:8080; }
location /projects/ { proxy_pass http://127.0.0.1:8080; }
